<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FletBox · all widgets with their defaults</title>
    <!-- data:, keeps the favicon 404 out of the console noise the audit reports. -->
    <link rel="icon" href="data:," />
    <!-- The repo's own icon font, reached through the ./src symlink that
         build-gallery.mjs creates. Without it every Icon paints the ligature
         as literal text ("chevron_left") and icon geometry means nothing. -->
    <link rel="stylesheet" href="./src/fonts/icons.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #bar {
        position: sticky; top: 0; z-index: 50;
        display: flex; align-items: center; gap: 10px;
        padding: 12px 20px; border-bottom: 1px solid;
      }
      #bar h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 650; }
      #bar .spacer { flex: 1; }
      #bar .meta { font-size: 12px; opacity: 0.7; }
      #bar button {
        font: inherit; font-size: 13px; font-weight: 600;
        padding: 6px 14px; border-radius: 8px; border: 1px solid;
        cursor: pointer;
      }
      #app { padding: 20px; max-width: 1440px; margin: 0 auto; }
      .group-title {
        font-size: 13px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.08em; margin: 26px 0 12px;
      }
      .grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px; align-items: start;
      }
      .card {
        display: flex; flex-direction: column; gap: 10px;
        padding: 14px; border-radius: 12px; min-width: 0;
      }
      .card.wide { grid-column: span 2; }
      .card .name { font-size: 14px; font-weight: 650; }
      .card .note { font-size: 11.5px; opacity: 0.7; margin-top: 2px; }
      /* translateZ(0) makes each stage its own containing block, so a widget
         that paints with position:absolute stays inside its card instead of
         covering the page and poisoning the screenshot. */
      .stage {
        position: relative; transform: translateZ(0);
        overflow: hidden; border-radius: 8px; min-width: 0;
      }
      .err {
        font: 12px/1.5 monospace; white-space: pre-wrap;
        padding: 10px; border-radius: 8px;
      }
      .snack-col { display: flex; flex-direction: column; gap: 8px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <h1>FletBox · todos los widgets</h1>
      <span class="meta" id="meta"></span>
      <span class="spacer"></span>
      <button id="light">Light</button>
      <button id="dark">Dark</button>
    </div>
    <div id="app"></div>
    <script type="module" src="./gallery.js"></script>
  </body>
</html>
