<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0">
    <!-- <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> -->
    <link rel="stylesheet" href="./src/fonts/icons.css">
    <link rel="icon" href="./src/assets/icon-192.png" sizes="192x192" type="image/png">
    
    <!-- SEO BASICS -->
    <title>FletBox - UI Framework</title>
    <meta name="description" content="FletBox: UI framework with powerful animations, gradients, and declarative components. Fast, lightweight, and easy to use.">
    <meta name="keywords" content="fletbox, framework, ui, javascript, animations, gradients">
    <meta name="author" content="Your name">
    
    <!-- OPEN GRAPH (for social sharing) -->
    <meta property="og:title" content="FletBox - UI Framework">
    <meta property="og:description" content="UI framework with powerful animations and gradients">
    <meta property="og:type" content="website">
    <meta property="og:url" content="./">
    <meta property="og:image" content="./src/assets/icon-512.png">
    <meta property="og:image:alt" content="FletBox">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="FletBox - UI Framework">
    <meta name="twitter:description" content="UI framework with powerful animations and gradients">
    <meta name="twitter:url" content="./">
    <meta name="twitter:image" content="./src/assets/icon-512.png">
    <meta name="twitter:image:alt" content="FletBox">

    <!-- The share tags stay relative on purpose: this one file runs on :8000,
         through a tunnel and on Pages. 'flet-box build' rewrites og:image,
         og:url, twitter:image and twitter:url to absolute URLs at the site
         origin in the copy it publishes, because a scraper does not resolve
         a relative path the way a browser does. -->
    
    <!-- THEME COLOR (for PWA) -->
    <meta name="theme-color" content="#18181b">
    
    <!-- GOOGLE ADSENSE (disabled by default on the framework demo)
         To activate: delete this comment wrapper but KEEP the <script> tag,
         and use your own ca-pub publisher ID. Ads only render on an approved
         domain, not on localhost.
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3380659231587676"
        crossorigin="anonymous"></script>
    -->
    
    <style>
        * { -webkit-text-size-adjust: 100%; }
        body { margin: 0; padding: 0; font-family: system-ui, sans-serif}
    </style>
</head>
<body>
    <div id="root"></div>
    <!-- Registrar Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('Service Worker registrado', reg))
                .catch(err => console.log('Error al registrar SW', err));
        }
    </script>
    <script type="module" src="src/app.js"></script>
</body>
</html>
